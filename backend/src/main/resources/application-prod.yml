spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:campuscoin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:campuscoin_app}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+07:00'

  jpa:
    hibernate:
      # Never changed. The schema is owned by db/merged/campuscoin_full.sql.
      ddl-auto: validate
    show-sql: false

campuscoin:
  security:
    password-reset:
      # Production sends the link through the SMTP server named by MAIL_HOST (see the smtp block
      # in application.yml). The sink stays disabled so the link is never written to disk on a
      # server; with it false, delivery is SMTP when MAIL_HOST and MAIL_FROM_ADDRESS are both set,
      # and the no-op otherwise - never a silent fallback to writing tokens to a file.
      sink-enabled: false
      # The verified sender the reset email is sent from. Must be one the SMTP account is
      # permitted to send as, or the provider rejects the message as spoofing. No default:
      # an unset address means SMTP delivery is unavailable and the no-op is installed.
      from-address: ${MAIL_FROM_ADDRESS:}
      from-name: ${MAIL_FROM_NAME:Campus Coin}

# Production must be served over HTTPS/TLS (see docs/SECURITY.md). Terminate TLS at the
# reverse proxy or enable the certificate here; plain HTTP is not acceptable for
# financial and personal data in transit.
server:
  # Set to true only when the application itself terminates TLS.
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

logging:
  level:
    com.campuscoin: INFO
    org.springframework.web: WARN
