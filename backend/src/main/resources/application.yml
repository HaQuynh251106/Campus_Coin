server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-coin-backend
  profiles:
    active: dev
  # The database schema is owned by db/merged/campuscoin_full.sql and is the single
  # source of truth. Hibernate is never allowed to create or alter it - see the
  # ddl-auto: validate setting in each profile file.
  jpa:
    open-in-view: false
  jackson:
    deserialization:
      # Reject a JSON number where an enum is expected.
      #
      # Jackson's default is to read a number as the enum's ORDINAL, so {"fontScale": 2} would
      # silently mean LARGE. That makes every enum in the API accept a second, undocumented
      # encoding whose meaning depends on the order of the Java constants - reordering an enum
      # would silently change what a stored client payload means. The contract is the member
      # name the database stores (e.g. "LARGE"), and nothing else should be accepted.
      fail-on-numbers-for-enums: true

# ---------------------------------------------------------------------------
# Campus Coin application settings
# ---------------------------------------------------------------------------
campuscoin:
  encryption:
    # Application-Level Field Encryption (AES-256-GCM) for the free-text columns the
    # database must not store in the clear: transactions.description,
    # recurring_rules.description and bookmarks.note.
    #
    # NOT applied to transactions.amount or recurring_rules.amount. MySQL has no
    # AES-GCM and cannot be given the key, so an encrypted amount could not be
    # SUM()-ed, compared or ordered by any view or procedure, and the whole reporting
    # tier would have to move into the application first. That is a separate,
    # separately-approved piece of work - see OB-013 in docs/OVERNIGHT_BLOCKERS.md.
    # Nothing on the encrypted columns is filtered, joined or aggregated, which is why
    # encrypting them breaks no SQL.
    #
    # A SYMMETRIC secret, Base64-encoded, decoding to exactly 32 bytes. It is not a
    # private key - AES-256-GCM uses the same secret in both directions.
    #
    # There is deliberately NO default. The application refuses to start without it
    # (see EncryptionService), because starting without a key would either write
    # plaintext where ciphertext is expected or invent a predictable one.
    #
    # Generate one with:  openssl rand -base64 32
    # It lives in the environment only: never in this file, never in git, never in
    # MySQL, never in a JWT, never sent to Angular.
    key: ${CAMPUSCOIN_ENCRYPTION_KEY}
    # Identifier written into every envelope this process produces, so a future key
    # rotation can tell which key encrypted a row. Rotation itself is not implemented
    # yet - see docs/SECURITY.md and the blocker in docs/OVERNIGHT_BLOCKERS.md.
    key-version: 1
  security:
    jwt:
      # HS256 requires at least 256 bits of key material. This value MUST be
      # supplied through the environment; there is deliberately no default.
      secret: ${JWT_SECRET}
      issuer: campus-coin
      # Fallback only. The live value is auth.session_ttl_minutes in system_settings,
      # so an administrator can retune session lifetime without a redeploy (VĐ-05).
      default-ttl-minutes: 120
    password-reset:
      # Base URL of the Angular reset screen. The link sent to the student is
      #   {base-url}?token={raw-token}
      # The raw token is never logged and never returned in an HTTP response (UC-03 B2).
      link-base-url: ${RESET_LINK_BASE_URL:http://localhost:4200/reset-password}
      # The verified sender a reset email is sent from. Must be an address the SMTP account is
      # permitted to send as, or the provider rejects the message as spoofing. Blank - the
      # default here - means SMTP delivery is unavailable and the no-op notifier is installed.
      from-address: ${MAIL_FROM_ADDRESS:}
      from-name: ${MAIL_FROM_NAME:Campus Coin}
      # The mail server that delivers the reset link. Deliberately NOT Spring Boot's spring.mail
      # block: that one is switched on by the mere presence of spring.mail.host, which an empty
      # value satisfies, so `host: ${MAIL_HOST:}` would build a sender aimed at a blank host in
      # every deployment that has no mail server. PasswordResetConfig reads these values directly
      # and treats a blank host as "no mail server", installing the no-op notifier instead.
      #
      # The password is a secret and lives in the environment only: never in this file, never in
      # git, never in MySQL, never in a JWT, never sent to Angular, never logged.
      smtp:
        host: ${MAIL_HOST:}
        # 587 is the submission port, which pairs with STARTTLS below. For implicit TLS use port
        # 465 and set MAIL_SSL=true together.
        port: ${MAIL_PORT:587}
        # Blank means no authentication, which is the ordinary case for a local catcher
        # (MailHog, Mailpit) and for some relays that identify the caller by IP.
        username: ${MAIL_USERNAME:}
        password: ${MAIL_PASSWORD:}
        # On by default: the message carries a one-time token, so an unencrypted hop would expose
        # account access. Set false only for a local catcher with no TLS.
        starttls: ${MAIL_STARTTLS:true}
        ssl: ${MAIL_SSL:false}
    login:
      # Fallback only; the live value is auth.max_login_attempts in system_settings.
      # Brute-force counters are held in memory per instance - see docs/SECURITY.md.
      default-max-attempts: 5
      # Reset requests allowed per address per window. Kept above 1 so a student whose link
      # expired can still ask for another one.
      max-reset-requests: 3
      lockout-minutes: 15
    cors:
      # Never a wildcard. Comma-separated list of the origins allowed to call the API.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  recurring:
    scheduler:
      # UC-09: the job that turns due recurring rules into transactions. It calls
      # sp_post_recurring_transactions, which owns the decision of which periods are due -
      # including catching up over periods missed while the application was down.
      #
      # Enabled by default; the test environment switches it off so a timer cannot write rows
      # during an assertion, and exercises the same procedure directly instead.
      enabled: ${RECURRING_SCHEDULER_ENABLED:true}
      # Once a day, shortly after midnight in the application's own zone. The exact minute does
      # not matter: the procedure is date-based rather than interval-based, so a late or repeated
      # run posts the same periods and no others (BR-16).
      cron: ${RECURRING_SCHEDULER_CRON:0 5 0 * * *}
  ai:
    # The external AI provider (UC-08 category suggestion, UC-17 monthly narrative).
    #
    # The provider is NEVER given database access. The flow is:
    #   Angular -> Spring Boot -> this backend reads and filters the student's own rows
    #                          -> a prepared context object -> provider
    #           <- this backend validates the answer <-
    # The port (AiSuggestionPort) has no repository, so an implementation cannot fetch anything
    # for itself; it can only send what a service deliberately handed it.
    #
    # With no credential the application starts normally and installs NoopAiSuggestionPort:
    # UC-08 falls back to the student's own category_rules keyword match, and UC-17 keeps the
    # RULE_BASED summary sp_generate_monthly_insight already wrote. Nothing is faked - the
    # insights.generated_by column records RULE_BASED rather than AI.
    #
    # The credential lives in the environment only: never in this file, never in git, never in
    # MySQL, never in a JWT, never sent to Angular. Empty is a supported deployment.
    api-key: ${GEMINI_API_KEY:}
    # The model to call. Changing this changes where student data is sent, which is why it is
    # deployment configuration rather than an administrator-tunable setting.
    model: ${AI_MODEL:gemini-3.5-flash}
    # A sentence or two of prose, or a small typed object. The cap is a guard, not a target.
    max-tokens: ${AI_MAX_TOKENS:1024}
    # Left unset in a real deployment so the SDK's own endpoint applies. Overridable so a test
    # can point at a stub.
    base-url: ${AI_BASE_URL:}
    # One call's latency bound. A timeout is treated as "no suggestion" and the caller continues.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
  tips:
    scheduler:
      # UC-18: the job that generates each active student's saving tips for the current month.
      # It calls sp_generate_tips, which applies the six rules and writes with INSERT IGNORE
      # against uk_tip_dedupe - so a repeated or concurrent run produces the same tips and no
      # others, and can never resurrect a tip a student dismissed (BR-14).
      #
      # Enabled by default; the test environment switches it off so a timer cannot write rows
      # during an assertion, and calls the same procedure directly instead.
      enabled: ${TIPS_SCHEDULER_ENABLED:true}
      # Once a day, ten minutes after the recurring run. The offset is deliberate: on the first
      # of the month the recurring job posts that day's transactions first, so the tips
      # generated afterwards see them rather than describing the month without them.
      cron: ${TIPS_SCHEDULER_CRON:0 10 0 * * *}

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Management & Health Endpoints
#
# Only the two probes the deployment needs are exposed, and SecurityConfig keeps them the only
# reachable /actuator paths. `metrics` is deliberately NOT exposed: nothing in the requirements
# asks for it, and it would publish internal counters to whoever can reach the port.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # `never`, not `always`. Component detail names the database and reports connection-pool
      # and disk state - useful to an operator, and exactly the kind of internal detail section
      # 7.7 keeps out of an unauthenticated response. `/actuator/health` stays public so a
      # container health probe still works, and answers with the summary status only.
      show-details: never
  health:
    mail:
      # Off, deliberately. The mail health indicator is auto-registered once an SMTP host is
      # configured, and it reports DOWN whenever the mail server cannot be reached - which would
      # turn `/actuator/health` red, and fail a container's health probe, for a fault that affects
      # exactly one feature. Every other use case the API serves works with the mail server down,
      # so password-reset delivery is not this service's health.
      enabled: false
