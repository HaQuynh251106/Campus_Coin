server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: campus-coin-backend
  profiles:
    active: dev

# OpenAPI / Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Management & Health Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
