spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # MySQL 8 running in Docker (see docker-compose.yml). The password comes from the
    # environment - the same MYSQL_PASSWORD used by the campuscoin_app account.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campuscoin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:campuscoin_app}
    password: ${DB_PASSWORD}
    hikari:
      # Every business view and stored procedure derives day / week / month boundaries
      # from the session clock. Without this the connection would use the container's
      # UTC default and reports could land in the wrong month (VĐ-10).
      connection-init-sql: SET time_zone = '+07:00'

  jpa:
    hibernate:
      # The schema already exists and is authoritative. validate only checks that the
      # entities match it; create / update / create-drop are forbidden for this project.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

campuscoin:
  security:
    password-reset:
      # Writes the reset link to a file under backend/target/ instead of sending email, so a
      # developer needs no mail server. The raw token is never written to the application log.
      #
      # Set RESET_SINK_ENABLED=false to exercise real SMTP locally: with the sink off and
      # MAIL_HOST / MAIL_FROM_ADDRESS set, PasswordResetConfig installs the SMTP notifier and
      # the link is actually sent. A local catcher on plain SMTP (MailHog, Mailpit) also needs
      # MAIL_STARTTLS=false and no MAIL_USERNAME. The default stays true so nothing is mailed
      # by accident.
      sink-enabled: ${RESET_SINK_ENABLED:true}

logging:
  level:
    com.campuscoin: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    # Never raise these to DEBUG: the JDBC binding log prints parameter values.
    org.hibernate.orm.jdbc.bind: WARN
