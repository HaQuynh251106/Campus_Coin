spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:campuscoindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.campuscoin: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
