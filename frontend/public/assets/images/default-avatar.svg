<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Soft Gold / Warm Cream Avatar Circular Background -->
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF5" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Rich Amber Fur Gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Shiny Gold Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular Avatar Frame with Warm Gold Rim -->
  <circle cx="32" cy="32" r="31" fill="url(#avatarBgGrad)" stroke="#FDE68A" stroke-width="2" />

  <!-- Avatar Artwork Container with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Bushy Squirrel Tail -->
    <path
      d="M 38 52 C 52 50 58 36 54 24 C 50 16 40 16 42 26 C 43 30 44 34 40 40 Z"
      fill="url(#furGrad)"
      opacity="0.95"
    />

    <!-- Squirrel Ears with Cream Inner Highlights -->
    <path d="M 18 18 L 22 30 L 14 30 Z" fill="url(#furGrad)" />
    <path d="M 17 21 L 20 28 L 15 28 Z" fill="#FDE68A" />

    <path d="M 30 18 L 34 30 L 26 30 Z" fill="url(#furGrad)" />
    <path d="M 29 21 L 32 28 L 27 28 Z" fill="#FDE68A" />

    <!-- Head Base -->
    <circle cx="24" cy="34" r="12" fill="url(#furGrad)" />

    <!-- Puffed Cheek / Muzzle -->
    <ellipse cx="20" cy="38" rx="7" ry="5" fill="#FEF3C7" />

    <!-- Friendly Sparkle Eye & Snout -->
    <circle cx="20" cy="32" r="2.4" fill="#18181B" />
    <circle cx="20.8" cy="31.2" r="0.8" fill="#FFFFFF" />
    <polygon points="14,38 16,36 16,40" fill="#78350F" />

    <!-- Gold Coin Held in Paws -->
    <circle cx="32" cy="44" r="9" fill="url(#coinGrad)" stroke="#CA8A04" stroke-width="1.6" />
    <!-- Coin Lightning Emblem -->
    <path d="M 33 39 L 29.6 44 L 32.4 44 L 31 49 L 35 43.6 L 32.4 43.6 Z" fill="#78350F" />

    <!-- Front Paws Gripping Coin -->
    <ellipse cx="26" cy="44" rx="2.4" ry="3" fill="#F59E0B" />
    <ellipse cx="36" cy="44" rx="2.4" ry="3" fill="#F59E0B" />
  </g>
</svg>
