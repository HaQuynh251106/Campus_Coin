<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Campus Coin — Smart Spending, Student Style</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Campus Coin — Smart Spending, Student Style. A student-first budgeting and expense-tracking web app.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter (Headings & Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Engine with Refined SaaS Design Tokens -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#EAB308',
              'gold-hover': '#CA8A04',
              'gold-tint': 'rgba(234, 179, 8, 0.1)',
              'gold-dark': '#A16207',
              // backward-compat aliases pointing to refined gold
              yellow: '#EAB308',
              mint: '#10B981',
              coral: '#EF4444',
              pink: '#EAB308',
              cyan: '#0284C7',
              purple: '#8B5CF6',
              bg: '#F9FAFB',
              dark: '#09090B',
              'dark-surface': '#18181B',
              'dark-card': '#18181B',
              'dark-border': '#27272A'
            }
          },
          boxShadow: {
            'subtle': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
            'subtle-lg': '0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05)',
            'brutal-sm': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            'brutal': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05)',
            'brutal-lg': '0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05)',
            'brutal-xl': '0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.05)',
            'brutal-white-sm': '0 1px 2px 0 rgba(0, 0, 0, 0.3)',
            'brutal-white': '0 1px 3px 0 rgba(0, 0, 0, 0.4)',
            'brutal-white-lg': '0 4px 6px -1px rgba(0, 0, 0, 0.4)'
          },
          fontFamily: {
            heading: ['Inter', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
          borderRadius: {
            'card': '12px'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#F9FAFB] dark:bg-[#09090B] text-[#09090B] dark:text-[#FAFAFA] font-sans antialiased selection:bg-amber-500/20 selection:text-amber-900 dark:selection:text-amber-200 min-h-screen">
